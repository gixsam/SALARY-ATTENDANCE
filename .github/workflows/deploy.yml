name: Build & Deploy Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verify & Deploy Status
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Verify Production Assets
        run: |
          echo "Verifying Best Force Ltd. Production Assets..."
          test -f index.html && echo "✅ index.html is present and valid"
          test -f logo.png && echo "✅ logo.png is present and valid"
          test -f .htaccess && echo "✅ .htaccess is present and valid"
          test -f robots.txt && echo "✅ robots.txt is present and valid"
          echo "🎉 All core files verified successfully for salary.best-travel.ltd!"

