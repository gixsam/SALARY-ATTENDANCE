name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files to Hostinger FTP (if secrets configured)
        if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            *.bat
            *.exe
            *.log
            *.tmp
            *.py
            *.zip
            logo-original.png

      - name: ℹ️ Deployment Status Notice
        if: ${{ secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '' }}
        run: |
          echo "✅ Repository build and integrity check passed!"
          echo "ℹ️ Hostinger is syncing directly via Hostinger Git Deployment / Webhook."
          echo "ℹ️ Optional: To also enable GitHub Actions FTP push, add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD to GitHub Secrets."
